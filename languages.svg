<svg width="360" height="198" viewBox="0 0 360 198" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Top languages">
  <style>text { font-family: 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }</style>
  <rect x="1" y="1" width="358" height="196" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="25" y="36" fill="#58a6ff" font-size="17" font-weight="700">Most Used Languages</text>
  
    <g>
      <text x="25" y="64" fill="#e6edf3" font-size="13">JavaScript</text>
      <text x="335" y="64" fill="#7d8590" font-size="12" text-anchor="end">66.7%</text>
      <rect x="25" y="70" width="310" height="8" rx="4" fill="#30363d"/>
      <rect x="25" y="70" width="200" height="8" rx="4" fill="#f1e05a">
        <animate attributeName="width" from="0" to="200" dur="0.8s" begin="0.00s" fill="freeze"/>
      </rect>
    </g>
    <g>
      <text x="25" y="96" fill="#e6edf3" font-size="13">HTML</text>
      <text x="335" y="96" fill="#7d8590" font-size="12" text-anchor="end">16.7%</text>
      <rect x="25" y="102" width="310" height="8" rx="4" fill="#30363d"/>
      <rect x="25" y="102" width="50" height="8" rx="4" fill="#e34c26">
        <animate attributeName="width" from="0" to="50" dur="0.8s" begin="0.10s" fill="freeze"/>
      </rect>
    </g>
    <g>
      <text x="25" y="128" fill="#e6edf3" font-size="13">TypeScript</text>
      <text x="335" y="128" fill="#7d8590" font-size="12" text-anchor="end">8.3%</text>
      <rect x="25" y="134" width="310" height="8" rx="4" fill="#30363d"/>
      <rect x="25" y="134" width="25" height="8" rx="4" fill="#3178c6">
        <animate attributeName="width" from="0" to="25" dur="0.8s" begin="0.20s" fill="freeze"/>
      </rect>
    </g>
    <g>
      <text x="25" y="160" fill="#e6edf3" font-size="13">Python</text>
      <text x="335" y="160" fill="#7d8590" font-size="12" text-anchor="end">8.3%</text>
      <rect x="25" y="166" width="310" height="8" rx="4" fill="#30363d"/>
      <rect x="25" y="166" width="25" height="8" rx="4" fill="#3572A5">
        <animate attributeName="width" from="0" to="25" dur="0.8s" begin="0.30s" fill="freeze"/>
      </rect>
    </g>
</svg>